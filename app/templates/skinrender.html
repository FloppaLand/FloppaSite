{% macro render_skin(name) %}
<style>
    .skin-viewer-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 0.5rem;
        overflow: hidden;
        background-color: transparent;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .skin-viewer-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
    }

    .skin-viewer-controls {
        position: absolute;
        bottom: 0.5rem;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        padding: 0 0.5rem;
        z-index: 10;
    }

    .skin-viewer-btn {
        background-color: rgba(0, 0, 0, 0.5);
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.375rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
        gap: 0.25rem;
        backdrop-filter: blur(0.5rem);
    }

    .skin-viewer-btn:hover {
        background-color: rgba(0, 0, 0, 0.7);
    }

    .skin-viewer-indicator {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background-color: #22c55e;
    }

    .skin-viewer-indicator.inactive {
        background-color: #a3a3a3;
    }
</style>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<div class="skin-viewer-wrapper">
    <div id="skin-viewer-container" class="skin-viewer-container"></div>

    <div class="skin-viewer-controls">
        <button id="btn-walk" class="skin-viewer-btn">
            <span class="skin-viewer-indicator"></span>
            Ходьба
        </button>
        <button id="btn-rotate" class="skin-viewer-btn">
            <span class="skin-viewer-indicator"></span>
            Вращение
        </button>
    </div>
</div>

<script type="module">
    import { initViewer, toggleWalk, toggleRotate } from "{{ url_for('static', filename='scripts/skin_viewer.js') }}";

    const skinUrl = "{{ url_for('get_skin', username=name) }}";
    
    initViewer('skin-viewer-container', skinUrl);

    let isWalking = true;
    let isRotating = true;

    const btnWalk = document.getElementById('btn-walk');
    const btnRotate = document.getElementById('btn-rotate');

    btnWalk.addEventListener('click', () => {
        isWalking = !isWalking;
        toggleWalk(isWalking);
        const indicator = btnWalk.querySelector('.skin-viewer-indicator');
        indicator.classList.toggle('inactive');
    });

    btnRotate.addEventListener('click', () => {
        isRotating = !isRotating;
        toggleRotate(isRotating);
        const indicator = btnRotate.querySelector('.skin-viewer-indicator');
        indicator.classList.toggle('inactive');
    });
</script>
{% endmacro %}
